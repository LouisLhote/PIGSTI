<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PIGSTI Draw.io Diagram (Nicer View)</title>
  <style>
    :root {
      --bg: #f8fafc;
      --ink: #0f172a;
      --muted: #64748b;
      --brand: #24b498;
      --brand-dark: #21325b;
      --card: #ffffff;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #dbeafe 0%, var(--bg) 22rem);
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .hero {
      background: linear-gradient(135deg, var(--brand-dark) 0%, #1e3a5f 60%, #0f172a 100%);
      color: #fff;
      border-bottom: 5px solid var(--brand);
      padding: 1.25rem 1.25rem 1.5rem;
    }
    .hero-inner {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      margin: 0;
      font-size: 1.45rem;
    }
    .subtitle {
      margin: 0.45rem 0 0;
      font-size: 0.95rem;
      opacity: 0.92;
    }
    main {
      max-width: 1200px;
      margin: -0.75rem auto 2rem;
      padding: 0 1rem;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
      padding: 1rem;
      margin-top: 1rem;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.75rem;
    }
    .btn {
      appearance: none;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #fff;
      color: #0f172a;
      text-decoration: none;
      padding: 0.38rem 0.85rem;
      font-size: 0.84rem;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .btn:hover { border-color: var(--brand); color: var(--brand-dark); }
    .btn.primary {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }
    .btn.primary:hover { background: #1d9c83; }
    .hint {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .viewer {
      width: 100%;
      min-height: 78vh;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }
    code {
      background: #eef2ff;
      border-radius: 4px;
      padding: 0.1em 0.32em;
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>PIGSTI Draw.io diagram</h1>
      <p class="subtitle">Nicer wrapper for the existing export at <code>PIGSTI.drawio.html</code>.</p>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="row">
        <a class="btn primary" href="PIGSTI.drawio.html" target="_blank" rel="noopener">Open Raw Export</a>
        <a class="btn" href="docs/pipeline_overview.html" target="_blank" rel="noopener">Open Curated Pipeline Overview</a>
        <a class="btn" href="docs/drawio/README.md" target="_blank" rel="noopener">Open Draw.io Maintainer Guide</a>
      </div>
      <p class="hint">
        If the embedded frame is blank, open <code>PIGSTI.drawio.html</code> directly or load it in diagrams.net.
      </p>
      <iframe class="viewer" src="PIGSTI.drawio.html" title="PIGSTI Draw.io embedded view"></iframe>
    </section>
  </main>
</body>
</html>
